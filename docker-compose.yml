version: '3.8'

services:
  placement-tracker:
    build: .
    container_name: placement-tracker
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      # Persistent storage for database, downloaded files, and WhatsApp auth session
      - ./placement_tracker.db:/app/placement_tracker.db
      - ./uploads:/app/uploads
      - ./.wwebjs_auth:/app/.wwebjs_auth
    environment:
      - PORT=8000
      - HOST=0.0.0.0
