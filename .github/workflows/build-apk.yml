name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK with Gradle
        working-directory: ./android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Rename APK
        run: |
          mkdir -p release-apk
          find android/app/build/outputs/apk/debug -name "*.apk" -exec cp {} release-apk/PlacementTracker-v1.0.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlacementTracker-APK
          path: release-apk/PlacementTracker-v1.0.apk
          retention-days: 30

      - name: Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Placement Tracker v1.0.${{ github.run_number }} (Downloadable APK)"
          body: |
            ## 📱 Placement Tracker Android App
            
            Download and install the APK directly on your Android phone!

            ### ✨ What it does:
            - **No WhatsApp Web QR code required**: Intercepts WhatsApp placement notifications directly via Android's native Notification Access.
            - **Direct Phone Notifications**: Shows high-priority system notifications with direct **"Apply Now"** buttons (no Discord / Telegram needed).
            - **Zero Phone Heat**: Powered by Google Gemini 3.5 Flash via cloud API + offline zero-heat heuristic.
            - **Local SQLite Database**: Stores all drives, statuses, and coordinator change timelines on your device.

            ### 📲 How to Install:
            1. Download `PlacementTracker-v1.0.apk` below to your Android phone.
            2. Tap the downloaded file to install (allow "Install from unknown sources" if prompted).
            3. Open the app and tap **Enable** on the top banner to grant Notification Access.
            4. (Optional) Enter your exact WhatsApp placement group name in the app to filter messages.
          files: release-apk/PlacementTracker-v1.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
